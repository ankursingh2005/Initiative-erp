services:
  - type: web
    name: idspl
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: idspl-postgres
          property: connectionString
      # For OTP delivery via Gmail HTTPS, copy the four GMAIL_* values from
      # the ignored .env.gmail into the host Environment settings and set
      # PASSWORD_RESET_EMAIL_PROVIDER=gmail. See GMAIL_PO_SETUP.md.
      # Local .env.gmail is not uploaded by Git deployment.
      # SMTP_PASSWORD is only used when selecting SMTP delivery.
      - key: SMTP_PASSWORD
        sync: false
      # WhatsApp Cloud API credentials and daily attendance delivery.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ATTENDANCE_RECIPIENTS
        value: "917521956646"
      - key: ATTENDANCE_WHATSAPP_CRON_SECRET
        sync: false
      # Optional approved Meta template with one body variable containing
      # the complete attendance summary. Recommended for scheduled messages.
      - key: WHATSAPP_ATTENDANCE_TEMPLATE
        sync: false
      - key: WHATSAPP_ATTENDANCE_TEMPLATE_LANGUAGE
        value: en_US
      # Anthropic API key used to read attached scheme documents
      # (image/PDF/Excel) and pre-fill Scheme Maintenance drafts, and also
      # used for the IDS Price System's image/PDF price list upload if set.
      # Optional: if left unset, scheme document upload still works but
      # fields must be filled in manually instead of being auto-extracted.
      # See README.md "Scheme documents (OCR + LLM extraction)" section.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional alternative AI vision keys for the IDS Price System's
      # image/PDF price list upload ONLY (scheme document extraction above
      # always uses Anthropic). Any one of ANTHROPIC_API_KEY, XAI_API_KEY,
      # or OPENAI_API_KEY is enough to enable reading a price list photo or
      # PDF; Anthropic is tried first if more than one is set (override
      # with VISION_PROVIDER). Images only for these two - PDF price lists
      # still need ANTHROPIC_API_KEY specifically.
      - key: XAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: idspl-postgres
    databaseName: idspl
    user: idspl
    # Free Render Postgres databases expire after 30 days. Use a persistent
    # paid tier for business data.
    plan: basic-256mb
